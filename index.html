<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Cash Zimbabwe | Loan Application</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      color: #17243a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px 0;
    }
    .wrapper {
      width: 100%;
      max-width: 550px;
    }
    
    /* Header Brand Card Style */
    .brand-card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      position: relative;
      overflow: hidden;
      padding: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }
    .brand-card::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: #10a343; /* Green Accent Bar */
    }
    .brand-logo {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .brand-logo span.primary { color: #002D62; } /* Navy Blue */
    .brand-logo span.accent { color: #E31B23; }  /* Red Accent */
    
    .user-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .user-icon {
      width: 36px;
      height: 36px;
      background: #e6edf8;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #002D62;
      margin-bottom: 4px;
    }
    .user-icon svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }
    .welcome-text {
      font-size: 13px;
      font-weight: bold;
      color: #333;
    }

    /* Main Form Card */
    main {
      background: white;
      padding: 28px;
      border-radius: 14px;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
    }
    h2 {
      color: #002D62;
      margin-top: 0;
    }
    label {
      display: block;
      margin: 17px 0 7px;
      font-weight: bold;
      color: #002D62;
    }
    input, select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccd3df;
      border-radius: 7px;
      font-size: 16px;
      color: #17243a;
    }
    input:focus, select:focus {
      outline: 2px solid #10a343;
      border-color: transparent;
    }
    input[type="range"] { padding: 0; accent-color: #10a343; }
    .amount {
      text-align: center;
      font-size: 27px;
      font-weight: bold;
      color: #10a343;
      margin: 15px;
    }
    button {
      width: 100%;
      padding: 15px;
      margin-top: 22px;
      border: 0;
      border-radius: 8px;
      background: #10a343;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    button:hover {
      background: #0d8737;
    }
    button:disabled {
      background: #93c5fd;
      cursor: not-allowed;
    }
    .terms {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-top: 20px;
    }
    .terms input { width: auto; margin-top: 3px; accent-color: #10a343; }
    .terms label { margin: 0; font-weight: normal; color: #555; }
  </style>
</head>
<body>

<div class="wrapper">
  <!-- Brand Header Card -->
  <div class="brand-card">
    <div class="brand-logo">
      <span class="primary">Quick Cash</span> <span class="accent">Zimbabwe</span>
    </div>
    <div class="user-section">
      <div class="user-icon">
        <svg viewBox="0 0 24 24">
          <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
        </svg>
      </div>
      <span class="welcome-text">Welcome</span>
    </div>
  </div>

  <main>
    <h2>Loan Application</h2>
    <form id="loanForm">
      <label>Full Name</label>
      <input name="fullName" required>

      <label>Phone Number</label>
      <input name="phone" type="tel" required>

      <label>National ID Number</label>
      <input name="nationalId" required>

      <label>Loan Amount (USD)</label>
      <div class="amount" id="amountDisplay">USD 500</div>
      <input id="loanAmount" name="loanAmount" type="range"
        min="500" max="50000" step="500" value="500">

      <label>Employment Status</label>
      <select name="employment" required>
        <option value="">Select employment status</option>
        <option>Employed</option>
        <option>Self-employed</option>
        <option>Unemployed</option>
        <option>Business owner</option>
      </select>

      <label>Monthly Net Income (USD)</label>
      <input name="income" type="number" min="0" required>

      <label>Repayment Timeline</label>
      <select name="repayment" required>
        <option value="">Select repayment period</option>
        <option>1 month</option>
        <option>3 months</option>
        <option>6 months</option>
        <option>9 months</option>
        <option>12 months</option>
        <option>18 months</option>
        <option>24 months</option>
      </select>

      <div class="terms">
        <input type="checkbox" id="terms" required>
        <label for="terms">I have read and accepted the loan terms and conditions.</label>
      </div>

      <button type="submit">Continue</button>
    </form>
  </main>
</div>

<script>
  const slider = document.getElementById("loanAmount");
  const display = document.getElementById("amountDisplay");

  slider.addEventListener("input", () => {
    display.textContent = "USD " +
      Number(slider.value).toLocaleString("en-US");
  });

  document.getElementById("loanForm").addEventListener("submit", async (event) => {
    event.preventDefault();

    const form = event.target;
    const button = form.querySelector('button[type="submit"]');

    const application = {
      full_name: form.elements["fullName"].value.trim(),
      phone: form.elements["phone"].value.trim(),
      national_id: form.elements["nationalId"].value.trim(),
      loan_amount: Number(form.elements["loanAmount"].value),
      employment_status: form.elements["employment"].value,
      monthly_income: Number(form.elements["income"].value),
      repayment_period: form.elements["repayment"].value
    };

    button.disabled = true;
    button.textContent = "Submitting...";

    try {
      const response = await fetch(
        "https://quickcash-backend.doviaskipmoi.workers.dev/applications",
        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(application)
        }
      );

      const result = await response.json();

      if (!response.ok || !result.success) {
        throw new Error(result.message || "Application failed.");
      }

      sessionStorage.setItem("applicationId", result.application_id);
      sessionStorage.setItem("applicationPhone", application.phone);

      alert("Application submitted successfully!");

      window.location.href = "verify.html";

    } catch (error) {
      alert(error.message || "Unable to submit. Please try again.");
      button.disabled = false;
      button.textContent = "Continue";
    }
  });
</script>

</body>
</html>
