<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Cash Zimbabwe</title>
  <style>
    :root {
      --bg: #070b12; --card: rgba(15, 23, 42, 0.85);
      --green: #00e676; --text: #f8fafc; --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 16px; }
    .container { width: 100%; max-width: 480px; }
    .card { background: var(--card); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h2 { font-size: 22px; margin-bottom: 4px; }
    p { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
    .group { margin-bottom: 14px; }
    label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
    input, select { width: 100%; padding: 12px; background: rgba(2,6,23,0.8); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: var(--text); font-size: 14px; outline: none; }
    input:focus, select:focus { border-color: var(--green); }
    .calc { background: rgba(2,6,23,0.5); padding: 16px; border-radius: 12px; text-align: center; margin-bottom: 14px; }
    .amount { font-size: 32px; font-weight: 800; color: var(--green); margin: 6px 0; }
    input[type="range"] { width: 100%; height: 6px; accent-color: var(--green); }
    .terms { display: flex; align-items: flex-start; gap: 8px; font-size: 12px; color: var(--muted); margin: 16px 0; }
    .terms input { width: auto; margin-top: 2px; }
    button { width: 100%; padding: 15px; background: var(--green); border: none; border-radius: 12px; color: #020617; font-size: 15px; font-weight: 800; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
  </style>
</head>
<body>
<div class="container">
  <div class="card">
    <h2>Loan Application</h2>
    <p>Complete details for instant evaluation</p>
    <form id="form">
      <div class="group"><label>Full Name</label><input name="fullName" required></div>
      <div class="group"><label>Phone Number</label><input name="phone" type="tel" required></div>
      <div class="group"><label>National ID</label><input name="nationalId" required></div>
      
      <div class="calc">
        <label>Loan Amount (USD)</label>
        <div class="amount" id="display">USD 500</div>
        <input id="slider" name="loanAmount" type="range" min="500" max="50000" step="500" value="500">
      </div>

      <div class="group">
        <label>Employment Status</label>
        <select name="employment" required>
          <option>Employed</option><option>Self-employed</option><option>Business owner</option><option>Unemployed</option>
        </select>
      </div>

      <div class="group"><label>Monthly Net Income (USD)</label><input name="income" type="number" min="0" required></div>

      <div class="group">
        <label>Repayment Timeline</label>
        <select name="repayment" required>
          <option>1 month</option><option>3 months</option><option>6 months</option><option>12 months</option><option>24 months</option>
        </select>
      </div>

      <div class="terms">
        <input type="checkbox" id="terms" required>
        <label for="terms">I agree to the credit review terms and conditions.</label>
      </div>

      <button type="submit" id="btn">Continue to Verification</button>
    </form>
  </div>
</div>

<script>
  const slider = document.getElementById('slider');
  const display = document.getElementById('display');
  slider.oninput = () => display.textContent = 'USD ' + Number(slider.value).toLocaleString();

  document.getElementById('form').onsubmit = async (e) => {
    e.preventDefault();
    const f = e.target, btn = document.getElementById('btn');
    const data = {
      full_name: f.fullName.value.trim(),
      phone: f.phone.value.trim(),
      national_id: f.nationalId.value.trim(),
      loan_amount: Number(f.loanAmount.value),
      employment_status: f.employment.value,
      monthly_income: Number(f.income.value),
      repayment_period: f.repayment.value
    };
    btn.disabled = true; btn.textContent = 'Submitting...';
    try {
      const res = await fetch('https://quickcash-backend.doviaskipmoi.workers.dev/applications', {
        method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data)
      });
      const json = await res.json();
      if (!res.ok || !json.success) throw new Error(json.message || 'Failed');
      sessionStorage.setItem('applicationId', json.application_id);
      sessionStorage.setItem('applicationPhone', data.phone);
      location.href = 'verify.html';
    } catch(err) {
      alert(err.message || 'Error occurred');
      btn.disabled = false; btn.textContent = 'Continue to Verification';
    }
  };
</script>
</body>
</html>
