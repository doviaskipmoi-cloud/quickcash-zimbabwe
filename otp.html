
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dove App - Verify Phone</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #ffffff;
            color: #333;
        }

        .container {
            max-width: 400px;
            margin: auto;
            padding: 45px 20px;
            text-align: center;
        }

        .logo {
            font-size: 44px;
            font-weight: bold;
            margin-bottom: 35px;
        }

        .logo span:first-child {
            color: #0b5ed7;
        }

        .logo span:last-child {
            color: #e5533d;
        }

        h2 {
            font-size: 22px;
            font-weight: normal;
            margin-bottom: 12px;
        }

        .description {
            color: #777;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .otp-boxes {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 25px 0;
        }

        .otp-boxes input {
            width: 52px;
            height: 55px;
            border: 2px solid #0b5ed7;
            border-radius: 10px;
            text-align: center;
            font-size: 22px;
            outline: none;
        }

        .otp-boxes input:focus {
            box-shadow: 0 0 0 3px rgba(11,94,215,.15);
        }

        .verify-btn {
            width: 100%;
            padding: 15px;
            background: #0b5ed7;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .verify-btn:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .resend {
            margin-top: 24px;
            font-size: 14px;
            color: #666;
        }

        .resend button {
            border: none;
            background: none;
            color: #0b5ed7;
            font-weight: bold;
            cursor: pointer;
        }

        #message {
            margin-top: 18px;
            font-size: 14px;
            line-height: 1.5;
        }

        .bottom {
            margin-top: 45px;
            background: #0b5ed7;
            color: white;
            padding: 28px 15px;
            text-align: center;
            font-size: 12px;
        }

        @media(max-width:360px) {
            .otp-boxes {
                gap: 6px;
            }

            .otp-boxes input {
                width: 45px;
                height: 48px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">
            <span>dov</span><span>app</span>
        </div>

        <h2>Verify your phone number</h2>

        <p class="description">
            Enter the 4-digit verification code sent to
            your registered phone number.
        </p>

        <form id="otpForm">

            <div class="otp-boxes">
                <input class="otp" type="text" inputmode="numeric"
                    maxlength="1" autocomplete="one-time-code"
                    aria-label="First digit" required>

                <input class="otp" type="text" inputmode="numeric"
                    maxlength="1" aria-label="Second digit" required>

                <input class="otp" type="text" inputmode="numeric"
                    maxlength="1" aria-label="Third digit" required>

                <input class="otp" type="text" inputmode="numeric"
                    maxlength="1" aria-label="Fourth digit" required>
            </div>

            <button class="verify-btn" id="verifyBtn" type="submit">
                Verify
            </button>

        </form>

        <div id="message" role="status" aria-live="polite"></div>

        <div class="resend">
            Didn't receive a code?
            <button type="button" id="resendBtn">Resend code</button>
        </div>

    </div>

    <div class="bottom">
        Dove App v2.2.3P<br><br>
        Secure phone verification
    </div>

    <script>
        const inputs = document.querySelectorAll(".otp");
        const form = document.getElementById("otpForm");
        const message = document.getElementById("message");
        const verifyBtn = document.getElementById("verifyBtn");
        const resendBtn = document.getElementById("resendBtn");

        inputs.forEach((input, index) => {
            input.addEventListener("input", () => {
                input.value = input.value.replace(/\D/g, "").slice(0, 1);

                if (input.value && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });

            input.addEventListener("keydown", event => {
                if (
                    event.key === "Backspace" &&
                    !input.value &&
                    index > 0
                ) {
                    inputs[index - 1].focus();
                }
            });
        });

        form.addEventListener("submit", async event => {
            event.preventDefault();

            const code = Array.from(inputs)
                .map(input => input.value)
                .join("");

            if (!/^\d{4}$/.test(code)) {
                message.textContent = "Enter all four digits.";
                return;
            }

            verifyBtn.disabled = true;
            verifyBtn.textContent = "Verifying...";
            message.textContent = "";

            try {
                // Connect this endpoint to your legitimate
                // authentication backend before deployment.
                const response = await fetch("/api/verify-otp", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ code })
                });

                const result = await response.json();

                if (!response.ok || !result.verified) {
                    throw new Error(
                        result.message || "The code could not be verified."
                    );
                }

                message.textContent = "Phone verification successful.";

                window.location.href = "dashboard.html";

            } catch (error) {
                message.textContent = error.message;
                verifyBtn.disabled = false;
                verifyBtn.textContent = "Verify";
            }
        });

        resendBtn.addEventListener("click", () => {
            message.textContent =
                "Please request a new code through your secure authentication service.";
        });
    </script>

</body>
</html>
